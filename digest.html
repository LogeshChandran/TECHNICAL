<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Weekly digest</title></head><body><main><h1>Weekly digest</h1><div id="d" class="muted">No digest yet (created on Saturdays).</div></main><script src="common.js"></script><script>
nav('Digest');
j('data/digest.json').then(D=>{if(!D.week_end)return;let s=`<p>Week ${esc(D.week_start)} to ${esc(D.week_end)} - ${D.total} breakouts | <a href="explore.html?from=${D.week_start}&to=${D.week_end}&smin=0">open all</a></p>
<pre>${esc(JSON.stringify(D.counts,null,1))}</pre><div class="wrap"><table><tr><th>Date</th><th>Symbol</th><th>TF</th><th>Pattern</th><th>Dir</th><th>Score</th><th>Outcome</th><th>Max fav %</th><th>Timeframes</th></tr>`;
D.top.forEach(r=>s+=`<tr><td><a href="chart.html?i=${r.instrument}&s=${encodeURIComponent(r.symbol)}&id=${r.id}">${esc(r.breakout_time)}</a></td><td>${esc(r.symbol)}</td><td>${esc(r.timeframe)}</td><td>${esc(pretty(r.pattern))}</td>
<td class="${esc(r.direction)}">${esc(r.direction)}</td><td>${r.score}</td><td class="${esc(r.outcome)}">${esc(String(r.outcome).replace(/_/g,' '))}</td><td>${r.max_fav_pct}</td><td>${esc(r.mtf_list)}</td></tr>`);
$('d').innerHTML=s+'</table></div>';});
</script></body></html>
